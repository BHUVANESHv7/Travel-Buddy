name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pyflakes
      - name: Lint
        run: python -m pyflakes main.py travel_buddy scripts tests
      - name: Tests
        env:
          PYTHONIOENCODING: utf-8
        run: python scripts/run_tests.py
